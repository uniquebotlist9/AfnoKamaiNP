name: Notification Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare VAPID keys and read push function logs
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const EP = 'https://sgp.cloud.appwrite.io/v1';

          const SITE_PUB = 'BE059IWEP_ohblWyVzofCA0-hlYSD1-S7H8fCVK5SVe_E7GSzsoP2Wcf7FTvjmopy2xu1N5s9w9UKZ3htWVfMI4';
          const OLD2_PUB = 'BCNMDTYRbkTYvC_1HbUVuZLHEpmeIVdY3NZNXPgmjrM';
          const OLD1_PUB = 'BAlZc5BOauiuRe1C5-KGq7162RG7W1';

          console.log('subject:', process.env.VAPID_SUBJECT);
          console.log('secret VAPID_PUBLIC_KEY :', process.env.VAPID_PUBLIC_KEY);

          let derived = '<derive failed>';
          try {
            const priv = Buffer.from(String(process.env.VAPID_PRIVATE_KEY), 'base64');
            const ecdh = crypto.createECDH('prime256v1');
            ecdh.setPrivateKey(priv);
            derived = ecdh.getPublicKey('base64');
          } catch (e) {
            derived = '<derive failed: ' + e.message + '>';
          }
          console.log('derived from PRIVATE    :', derived);
          console.log('secret pair internally consistent:', derived === process.env.VAPID_PUBLIC_KEY);
          console.log('secret matches SITE key          :', process.env.VAPID_PUBLIC_KEY === SITE_PUB);
          console.log('derived matches SITE key         :', derived === SITE_PUB);
          console.log('secret matches OLD pair2 (.env.example):', process.env.VAPID_PUBLIC_KEY === OLD2_PUB);

          async function aw(method, path) {
            const res = await fetch(EP + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
                'X-Appwrite-Key': process.env.APPWRITE_API_KEY
              }
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (_) {}
            return { status: res.status, json };
          }

          (async () => {
            // Find the push function.
            const list = await aw('GET', '/functions?limit=25');
            if (list.status >= 400) {
              console.log('FUNCTIONS LIST denied:', list.status, JSON.stringify(list.json));
              console.log('DONE');
              return;
            }
            const fns = list.json.functions || list.json.total && list.json.functions || [];
            for (const f of fns) console.log('FN', f.$id, '|', f.name, '| enabled=' + f.enabled, '| runtime=' + (f.runtime || '-'));

            const pushFn = fns.find((f) => /push/i.test(f.name) || /push/i.test(f.$id));
            if (!pushFn) { console.log('no push function found'); console.log('DONE'); return; }

            // Recent executions: stdout/errors carry the FCM error body.
            const ex = await aw('GET', '/functions/' + pushFn.$id + '/executions?limit=8&query=' +
              encodeURIComponent(JSON.stringify({ method: 'orderDesc', attribute: 'createdAt', values: [] })));
            if (ex.status >= 400) {
              console.log('EXECUTIONS denied:', ex.status, JSON.stringify(ex.json));
              console.log('DONE');
              return;
            }
            for (const e of ex.json.executions || []) {
              const blob = [e.trigger || '', e.status || '', String(e.stdout || ''), String(e.errors || ''), String(e.logs || '')].join(' ');
              const interesting = blob.split('\n').filter((l) => /403|VAPID|push error|Vapid|vapid|Forbidden|401|webpush/i.test(l)).slice(0, 6);
              console.log('EX ' + (e.$createdAt || '-') + ' ' + (e.trigger || '-') + ' status=' + (e.status || '-') + ' exit=' + (e.exitCode === undefined ? '-' : e.exitCode));
              for (const l of interesting) console.log('   >', l.slice(0, 300));
            }
            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
