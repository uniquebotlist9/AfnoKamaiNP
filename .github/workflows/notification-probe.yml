name: Notification Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Restore push-sender VAPID vars and verify
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const EP = 'https://sgp.cloud.appwrite.io/v1';
          const FN = 'push-sender';
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function aw(method, path, body) {
            const res = await fetch(EP + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
                'X-Appwrite-Key': process.env.APPWRITE_API_KEY
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (_) {}
            return { status: res.status, json, text };
          }

          function brief(r) {
            return r.status + ' ' + (r.text || '').slice(0, 300);
          }

          (async () => {
            const fn0 = await aw('GET', '/functions/' + FN);
            console.log('vars now:', ((fn0.json && fn0.json.vars) || []).map((v) => v.key).join(',') || '<none>');

            const targets = {
              VAPID_PUBLIC_KEY: process.env.VAPID_PUBLIC_KEY,
              VAPID_PRIVATE_KEY: process.env.VAPID_PRIVATE_KEY,
              VAPID_SUBJECT: process.env.VAPID_SUBJECT
            };
            const missing = Object.keys(targets).filter((k) => !targets[k]);
            if (missing.length) { console.log('MISSING SECRETS:', missing.join(',')); process.exit(1); }

            const restoreStart = new Date().toISOString();

            for (const key of Object.keys(targets)) {
              const value = targets[key];
              const id = key.toLowerCase();

              // 1. Create (the vars were deleted by the previous run).
              let r = await aw('POST', '/functions/' + FN + '/variables', { key, value });
              console.log('CREATE ' + key + ' -> ' + brief(r));
              if (r.status === 200 || r.status === 201) { await sleep(400); continue; }

              // 2. If create refuses, try update shapes in case it still exists.
              const shapes = [
                { m: 'PUT', p: '/functions/' + FN + '/variables/' + id, b: { key, value } },
                { m: 'PUT', p: '/functions/' + FN + '/variables/' + id, b: { value } },
                { m: 'PATCH', p: '/functions/' + FN + '/variables/' + id, b: { key, value } },
                { m: 'PATCH', p: '/functions/' + FN + '/variables/' + id, b: { value } },
                { m: 'POST', p: '/functions/' + FN + '/variables', b: { key, value, secret: key.includes('PRIVATE') } }
              ];
              let ok = false;
              for (const s of shapes) {
                r = await aw(s.m, s.p, s.b);
                console.log(s.m + ' ' + s.p + ' ' + JSON.stringify(s.b).slice(0, 40) + ' -> ' + brief(r));
                if (r.status === 200 || r.status === 201) { ok = true; break; }
                await sleep(300);
              }
              if (!ok) { console.log('RESTORE FAILED for ' + key); }
              await sleep(400);
            }

            const fn1 = await aw('GET', '/functions/' + FN);
            const vars = (fn1.json && fn1.json.vars) || [];
            console.log('vars after restore:', vars.map((v) => v.key).join(',') || '<none>');
            const haveAll = ['VAPID_PUBLIC_KEY', 'VAPID_PRIVATE_KEY', 'VAPID_SUBJECT'].every((k) => vars.some((v) => v.key === k));
            console.log('all three present:', haveAll);
            if (!haveAll) { console.log('DONE'); process.exit(1); }

            // Trigger immediately if scope allows; otherwise rely on schedule.
            const trig = await aw('POST', '/functions/' + FN + '/executions', {});
            console.log('manual trigger -> ' + brief(trig));

            // Wait for an execution that started AFTER the restore and read it.
            const deadline = Date.now() + 6.5 * 60 * 1000;
            let verified = false;
            while (Date.now() < deadline && !verified) {
              await sleep(20000);
              const ex = await aw('GET', '/functions/' + FN + '/executions?limit=5&query=' +
                encodeURIComponent(JSON.stringify({ method: 'orderDesc', attribute: 'createdAt', values: [] })));
              const list = (ex.json && ex.json.executions) || [];
              for (const e of list.filter((x) => x.$createdAt > restoreStart)) {
                const d = await aw('GET', '/functions/' + FN + '/executions/' + e.$id);
                const out = String((d.json && (d.json.logs || d.json.stdout)) || '');
                if (!out) continue;
                console.log('EXEC ' + e.$createdAt + ' trigger=' + e.trigger + ':');
                console.log(out.slice(0, 2500));
                const bad403 = /"status":403|VapidPkHashMismatch|do not correspond/.test(out);
                const fatal = /FATAL|required/i.test(out);
                const m = out.match(/"sent":(\d+)/);
                const sent = m ? Number(m[1]) : 0;
                if (fatal) { console.log('function still failing env check'); }
                else if (bad403) { console.log('STILL VAPID MISMATCH'); }
                else if (sent > 0) { console.log('FIX VERIFIED: sent=' + sent + ', no VAPID mismatches'); verified = true; }
                else { console.log('ran clean but sent=0 (queue empty or all skipped)'); verified = true; }
                break;
              }
            }
            if (!verified) console.log('NOT VERIFIED in window — check the next scheduled run');
            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
