name: Notification Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove test delivery-log rows (json query)
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
        run: |
          node <<'NODE'
          const EP = 'https://sgp.cloud.appwrite.io/v1';
          const DB = process.env.APPWRITE_DATABASE_ID;

          async function aw(method, path, body) {
            const res = await fetch(EP + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
                'X-Appwrite-Key': process.env.APPWRITE_API_KEY
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (_) {}
            return { status: res.status, json, text };
          }

          const base = (t) => '/tablesdb/' + DB + '/tables/' + t;
          const TEST_IDS = ['fixedtest0726', 'fixedtest1026'];

          (async () => {
            // Try query-parameter shapes until one returns newest-first rows.
            const shapes = [
              { name: 'singular JSON $createdAt',
                q: '&query=' + encodeURIComponent(JSON.stringify({ method: 'orderDesc', attribute: '$createdAt', values: [] })) },
              { name: 'singular JSON createdAt',
                q: '&query=' + encodeURIComponent(JSON.stringify({ method: 'orderDesc', attribute: 'createdAt', values: [] })) },
              { name: 'array JSON queries',
                q: '&queries=' + encodeURIComponent(JSON.stringify(['orderDesc("$createdAt")'])) }
            ];

            let rows = [];
            for (const s of shapes) {
              const r = await aw('GET', base('/notificationLog/rows?limit=25' + s.q));
              const got = (r.json && r.json.rows) || [];
              console.log('shape "' + s.name + '" -> status=' + r.status + ' rows=' + got.length +
                ' newest=' + (got[0] && got[0].$createdAt));
              if (got.length && String(got[0].$createdAt || '').startsWith('2026-10-09T07')) {
                rows = got;
                console.log('using: ' + s.name);
                break;
              }
            }

            if (!rows.length) {
              console.log('no shape returned newest-first rows — aborting');
              console.log('DONE');
              process.exit(0);
            }

            let deleted = 0;
            for (const row of rows) {
              if (TEST_IDS.some((t) => String(row.notificationId || '').startsWith(t))) {
                const d = await aw('DELETE', base('/notificationLog/rows/' + row.$id));
                console.log('delete log ' + row.$id + ' notif=' + row.notificationId +
                  ' status=' + row.status + ' -> ' + d.status);
                if (d.status === 204) deleted++;
              }
            }
            console.log('deleted=' + deleted);

            const l2 = await aw('GET', base('/notificationLog/rows?limit=5'));
            console.log('final: notificationLog total=' + (l2.json && l2.json.total));
            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
