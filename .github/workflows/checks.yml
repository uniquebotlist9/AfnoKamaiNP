name: Website regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - run: npm ci
        working-directory: functions/push-fn
      - run: npm run check
        working-directory: scripts
      # Local-tooling dependency advisories. These scripts never ship to
      # Hosting, so a transitive advisory (firebase-admin -> node-forge/uuid)
      # is reported but must not gate a frontend deploy. Bumping firebase-admin
      # to v14 is a breaking change for scripts/set-admin.cjs and friends and
      # needs its own change; keep this visible rather than blocking.
      - run: npm audit --omit=dev
        working-directory: scripts
        continue-on-error: true
      - run: npm audit --omit=dev
        working-directory: functions/push-fn
