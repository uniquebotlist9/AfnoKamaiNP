name: Referral Repair

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe and repair referral mappings
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
        run: |
          node <<'NODE'
          const EP = 'https://sgp.cloud.appwrite.io/v1';
          const DB = process.env.APPWRITE_DATABASE_ID;
          const HDR = {
            'Content-Type': 'application/json',
            'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
            'X-Appwrite-Key': process.env.APPWRITE_API_KEY
          };
          const CODE_RE = /^AFK-[A-HJ-NP-Z2-9]{8}$/;
          const HANDLE_RE = /^[a-z0-9][a-z0-9._-]{2,29}$/;
          const PERMS = ['read("any")', 'read("team:admins")', 'update("team:admins")', 'delete("team:admins")'];
          const now = () => new Date().toISOString().replace('Z', '+00:00');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function aw(method, path, body) {
            for (let i = 0; ; i++) {
              let res;
              try {
                res = await fetch(EP + path, {
                  method,
                  headers: HDR,
                  body: body === undefined ? undefined : JSON.stringify(body)
                });
              } catch (e) {
                if (i >= 4) throw e;
                await sleep(300 * Math.pow(2, i));
                continue;
              }
              if (res.status === 429 && i < 6) {
                await sleep(1000 * (i + 1));
                continue;
              }
              const text = await res.text();
              let json = null;
              try { json = text ? JSON.parse(text) : null; } catch (_) {}
              if (res.status >= 400) {
                throw new Error(method + ' ' + path + ' -> ' + res.status + ' ' + JSON.stringify(json));
              }
              return json;
            }
          }

          const rowsBase = (t) => '/tablesdb/' + DB + '/tables/' + t + '/rows';

          async function getRow(table, id) {
            const q = encodeURIComponent(JSON.stringify({ method: 'equal', attribute: '$id', values: [id] }));
            const out = await aw('GET', rowsBase(table) + '?queries%5B0%5D=' + q + '&limit=1');
            return (out.rows || out.documents || [])[0] || null;
          }

          async function createRow(table, rowId, data) {
            try {
              await aw('POST', rowsBase(table), { rowId: rowId, data: data, permissions: PERMS });
              return 'row-granted';
            } catch (e) {
              // Fall back to the proven plain shape; the referral tables carry a
              // table-level read("any") grant, so guest reads still work.
              await aw('POST', rowsBase(table), { rowId: rowId, data: data });
              return 'table-granted';
            }
          }

          async function listAll(table) {
            const out = [];
            let cursor = null;
            for (let page = 0; page < 60; page++) {
              const qs = [{ method: 'limit', values: [100] }];
              if (cursor) qs.push({ method: 'cursorAfter', values: [cursor] });
              const q = qs.map((x, i) => 'queries%5B' + i + '%5D=' + encodeURIComponent(JSON.stringify(x))).join('&');
              const res = await aw('GET', rowsBase(table) + '?' + q);
              const rows = res.rows || res.documents || [];
              out.push(...rows);
              if (rows.length < 100) break;
              cursor = rows[rows.length - 1].$id;
              if (out.length >= 5000) break;
            }
            return out;
          }

          (async () => {
            const users = await listAll('users');
            console.log('users scanned:', users.length);
            let repaired = 0, checked = 0, unfixable = 0;

            for (const u of users) {
              const uid = u.$id;
              const code = String(u.referralCode || '');
              const handle = String(u.referralHandle || '').trim().toLowerCase();
              if (!code && !handle) continue;
              checked++;
              const notes = [];
              let dirty = false;

              // 1. referralCodes/{code}: the code-form link and the handle-to-code hop.
              if (code && CODE_RE.test(code)) {
                const codeRow = await getRow('referralCodes', code);
                if (!codeRow) {
                  const how = await createRow('referralCodes', code, { code: code, userId: uid, createdAt: now() });
                  notes.push('code row CREATED (' + how + ')');
                  dirty = true;
                }
              } else if (code) {
                notes.push('code malformed: ' + code);
              }

              // 2. referralHandles/{handle}: the vanity link.
              if (handle) {
                if (!HANDLE_RE.test(handle)) {
                  notes.push('handle malformed: ' + handle + ' (landing can never resolve it)');
                  unfixable++;
                } else {
                  const hRow = await getRow('referralHandles', handle);
                  if (!hRow) {
                    if (!code || !CODE_RE.test(code)) {
                      notes.push('handle row MISSING but no valid code to link it to');
                      unfixable++;
                    } else {
                      const how = await createRow('referralHandles', handle, { handle: handle, userId: uid, code: code, createdAt: now() });
                      notes.push('handle row CREATED (' + how + ')');
                      dirty = true;
                    }
                  } else if (hRow.userId !== uid) {
                    notes.push('handle owned by ' + hRow.userId + ' (left alone)');
                  } else {
                    const hc = String(hRow.code || '');
                    if (CODE_RE.test(hc)) {
                      const hcRow = await getRow('referralCodes', hc);
                      if (!hcRow) {
                        await createRow('referralCodes', hc, { code: hc, userId: uid, createdAt: now() });
                        notes.push('handle-target code row CREATED');
                        dirty = true;
                      }
                    } else {
                      notes.push('handle points at malformed code: ' + hc);
                    }
                  }
                }
              }

              if (notes.length) {
                console.log((dirty ? 'REPAIRED ' : 'OK ') + uid + ' code=' + (code || '-') + ' handle=' + (handle || '-') + ' | ' + notes.join('; '));
                if (dirty) repaired++;
              }
            }
            console.log('related users:', checked, '| repaired:', repaired, '| unfixable:', unfixable);

            // Final verification for the account under investigation.
            const target = 'MRTWoUMajWb52Jv62FxgDX6Q6dm1';
            const tu = users.find((x) => x.$id === target);
            if (!tu) {
              console.log('VERIFY target user row NOT FOUND');
            } else {
              const h = String(tu.referralHandle || '').trim().toLowerCase();
              const c = String(tu.referralCode || '');
              const hr = h ? await getRow('referralHandles', h) : null;
              const cr = c ? await getRow('referralCodes', c) : null;
              console.log('VERIFY profile: referralHandle=' + JSON.stringify(h) + ' referralCode=' + JSON.stringify(c));
              console.log('VERIFY codeRow: ' + (cr ? 'exists userId=' + cr.userId + (cr.userId === target ? ' (match)' : ' (MISMATCH)') : 'MISSING'));
              console.log('VERIFY handleRow: ' + (hr ? 'exists userId=' + hr.userId + (hr.userId === target ? ' (match)' : ' (MISMATCH)') + ' code=' + hr.code : 'MISSING'));
              if (hr) {
                const q = encodeURIComponent(JSON.stringify({ method: 'equal', attribute: '$id', values: [h] }));
                const g = await fetch(EP + rowsBase('referralHandles') + '?queries%5B0%5D=' + q + '&limit=1', {
                  headers: { 'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID }
                });
                const gj = await g.json().catch(() => ({}));
                console.log('VERIFY guest-read (anonymous landing): HTTP ' + g.status + ' total=' + gj.total);
              }
            }
            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
