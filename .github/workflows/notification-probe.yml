name: Notification Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Converge push-sender VAPID vars and verify
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const EP = 'https://sgp.cloud.appwrite.io/v1';
          const FN = 'push-sender';
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function aw(method, path, body) {
            const res = await fetch(EP + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
                'X-Appwrite-Key': process.env.APPWRITE_API_KEY
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (_) {}
            return { status: res.status, json };
          }

          (async () => {
            const fn = await aw('GET', '/functions/' + FN);
            if (fn.status !== 200) {
              console.log('FUNCTION GET failed:', fn.status, JSON.stringify(fn.json));
              process.exit(1);
            }
            const vars = fn.json.vars || [];
            console.log('vars found:', vars.map((v) => v.key).join(', '));

            const targets = {
              VAPID_PUBLIC_KEY: process.env.VAPID_PUBLIC_KEY,
              VAPID_PRIVATE_KEY: process.env.VAPID_PRIVATE_KEY,
              VAPID_SUBJECT: process.env.VAPID_SUBJECT
            };
            const missing = Object.keys(targets).filter((k) => !targets[k]);
            if (missing.length) {
              console.log('MISSING SECRETS:', missing.join(','));
              process.exit(1);
            }

            const updateStart = new Date().toISOString();
            let allOk = true;

            for (const key of Object.keys(targets)) {
              const v = vars.find((x) => x.key === key);
              if (!v) {
                console.log('VAR ' + key + ' NOT FOUND — creating');
                const created = await aw('POST', '/functions/' + FN + '/variables', { key, value: targets[key] });
                console.log('  create -> ' + created.status);
                if (created.status >= 400) allOk = false;
                continue;
              }
              const attempts = [
                { p: '/functions/' + FN + '/variables/' + v.$id, b: { key, value: targets[key] } },
                { p: '/functions/' + FN + '/variables/' + v.$id, b: { value: targets[key] } },
                { p: '/functions/' + FN + '/vars/' + v.$id, b: { key, value: targets[key] } },
                { p: '/functions/' + FN + '/vars/' + v.$id, b: { value: targets[key] } }
              ];
              let done = 0;
              for (const a of attempts) {
                const r = await aw('PATCH', a.p, a.b);
                if (r.status === 200) { done = r.status; console.log('VAR ' + key + ' updated via ' + a.p); break; }
                done = r.status;
              }
              if (done !== 200) {
                // Last resort: delete + recreate.
                const del = await aw('DELETE', '/functions/' + FN + '/variables/' + v.$id);
                const cre = await aw('POST', '/functions/' + FN + '/variables', { key, value: targets[key] });
                console.log('VAR ' + key + ' patch failed, delete=' + del.status + ' create=' + cre.status);
                if (cre.status !== 200) allOk = false;
                else console.log('VAR ' + key + ' recreated');
              }
            }

            if (!allOk) {
              console.log('FIX INCOMPLETE — aborting before verification');
              process.exit(1);
            }

            // Try to trigger immediately; if execution scope is denied, fall
            // back to the function's own every-5-minute schedule.
            const trig = await aw('POST', '/functions/' + FN + '/executions', {});
            console.log('manual trigger ->', trig.status);

            // Poll for an execution that STARTED after the update and has logs.
            const deadline = Date.now() + 6.5 * 60 * 1000;
            let verified = false;
            while (Date.now() < deadline && !verified) {
              await sleep(20000);
              const ex = await aw('GET', '/functions/' + FN + '/executions?limit=6&query=' +
                encodeURIComponent(JSON.stringify({ method: 'orderDesc', attribute: 'createdAt', values: [] })));
              const list = (ex.json && ex.json.executions) || [];
              const fresh = list.filter((e) => e.$createdAt > updateStart);
              for (const e of fresh) {
                const d = await aw('GET', '/functions/' + FN + '/executions/' + e.$id);
                const out = String((d.json && (d.json.logs || d.json.stdout)) || '');
                if (!out) continue;
                console.log('EXEC ' + e.$createdAt + ' trigger=' + e.trigger + ':');
                console.log(out.slice(0, 2500));
                const bad403 = /"status":403|VapidPkHashMismatch|do not correspond/.test(out);
                const sentMatch = out.match(/"sent":(\d+)/);
                const sent = sentMatch ? Number(sentMatch[1]) : 0;
                if (!bad403 && sent > 0) {
                  console.log('FIX VERIFIED: sent=' + sent + ', no VAPID mismatches');
                  verified = true;
                } else if (bad403) {
                  console.log('still failing with VAPID mismatch — keys not applied yet');
                } else {
                  console.log('ran but sent=0 (queue may be empty or all skipped)');
                }
                break;
              }
            }
            if (!verified) console.log('NOT VERIFIED within window — re-run the probe to inspect the next scheduled run');
            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
