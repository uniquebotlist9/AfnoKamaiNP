name: Notification Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect test notification failure
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
        run: |
          node <<'NODE'
          const EP = 'https://sgp.cloud.appwrite.io/v1';
          const DB = process.env.APPWRITE_DATABASE_ID;

          async function aw(method, path, body) {
            const res = await fetch(EP + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
                'X-Appwrite-Key': process.env.APPWRITE_API_KEY
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (_) {}
            return { status: res.status, json, text };
          }

          const base = (t) => '/tablesdb/' + DB + '/tables/' + t;

          (async () => {
            // 1. Full logs of the event execution that processed the test row.
            const ex = await aw('GET', '/functions/push-sender/executions?limit=8&query=' +
              encodeURIComponent(JSON.stringify({ method: 'orderDesc', attribute: 'createdAt', values: [] })));
            const list = (ex.json && ex.json.executions) || [];
            const evt = list.find((e) => e.trigger === 'event' && e.$createdAt >= '2026-10-09T07:29');
            if (evt) {
              const d = await aw('GET', '/functions/push-sender/executions/' + evt.$id);
              const j = d.json || {};
              console.log('EVENT EXEC ' + evt.$createdAt);
              for (const f of ['logs', 'stdout', 'stderr', 'errors']) {
                const v = String(j[f] || '');
                console.log('-- ' + f + ' (' + v.length + ') --');
                console.log(v);
              }
            } else {
              console.log('no event exec found; triggers: ' + list.map((e) => e.trigger + '@' + e.$createdAt).join(', '));
            }

            // 2. The newest notification row — the real $id and final state.
            const n = await aw('GET', base('/notifications/rows?limit=100'));
            const nrows = (n.json && n.json.rows) || [];
            console.log('NOTIFICATIONS total=' + (n.json && n.json.total));
            const last = nrows[nrows.length - 1];
            if (last) {
              console.log('LAST N ' + last.$id + ' created=' + last.$createdAt + ' type=' + last.type +
                ' pushState=' + last.pushState + ' attempts=' + last.pushAttempts +
                ' skipReason=' + (last.pushSkipReason || '-') + ' lastError=' + (last.pushLastError || '-') +
                ' deviceCount=' + last.pushDeviceCount + ' sentCount=' + last.pushSentCount);
            }
            const mine = nrows.find((r) => String(r.title || '').includes('Notifications fixed'));
            if (mine) {
              console.log('TEST N ' + mine.$id + ' pushState=' + mine.pushState + ' attempts=' + mine.pushAttempts +
                ' skipReason=' + (mine.pushSkipReason || '-') + ' lastError=' + (mine.pushLastError || '-') +
                ' deviceCount=' + mine.pushDeviceCount + ' sentCount=' + mine.pushSentCount +
                ' perms=' + JSON.stringify(mine.$permissions));
            }

            // 3. The newest delivery-log rows, in full.
            const l = await aw('GET', base('/notificationLog/rows?limit=100'));
            const lrows = (l.json && l.json.rows) || [];
            console.log('NOTIFICATIONLOG total=' + (l.json && l.json.total));
            for (const r of lrows.slice(-4)) {
              console.log('L ' + r.$id + ' ' + r.$createdAt + ' status=' + r.status + ' error=' + (r.error || '-') +
                ' notif=' + r.notificationId + ' sub=' + r.subscriptionId + ' user=' + r.userId);
            }

            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
