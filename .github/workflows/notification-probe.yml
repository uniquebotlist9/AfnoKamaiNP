name: Notification Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect latest failure detail
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
        run: |
          node <<'NODE'
          const EP = 'https://sgp.cloud.appwrite.io/v1';
          const DB = process.env.APPWRITE_DATABASE_ID;

          async function aw(method, path, body) {
            const res = await fetch(EP + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
                'X-Appwrite-Key': process.env.APPWRITE_API_KEY
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (_) {}
            return { status: res.status, json, text };
          }

          (async () => {
            // 1. Full detail of the post-restore execution.
            const ex = await aw('GET', '/functions/push-sender/executions/6ac8968439d43b977381');
            const d = ex.json || {};
            console.log('EXEC detail status=' + ex.status + ' fnStatus=' + d.status);
            for (const field of ['logs', 'stdout', 'stderr', 'errors']) {
              const v = String(d[field] || '');
              console.log('--- ' + field + ' (' + v.length + ' chars) ---');
              console.log(v.slice(0, 6000));
            }

            // 2. Newest notificationLog rows (default order is ascending).
            const l = await aw('GET', '/tablesdb/' + DB + '/tables/notificationLog/rows?limit=60');
            const lrows = (l.json && l.json.rows) || [];
            console.log('NOTIFICATIONLOG total=' + (l.json && l.json.total) + ' showing last 15:');
            for (const r of lrows.slice(-15)) {
              console.log('  L ' + r.$createdAt + ' status=' + r.status + ' error=' + (r.error || '-') +
                ' notif=' + String(r.notificationId || '').slice(0, 28) + ' sub=' + String(r.subscriptionId || '').slice(0, 24));
            }

            // 3. Newest notifications — pushState distribution at the tail.
            const n = await aw('GET', '/tablesdb/' + DB + '/tables/notifications/rows?limit=60');
            const nrows = (n.json && n.json.rows) || [];
            console.log('NOTIFICATIONS total=' + (n.json && n.json.total) + ' last 15:');
            for (const r of nrows.slice(-15)) {
              console.log('  N ' + r.$createdAt + ' type=' + r.type + ' pushState=' + r.pushState +
                ' attempts=' + (r.pushAttempts === undefined ? '-' : r.pushAttempts) +
                ' lastErr=' + (r.pushLastError === undefined ? '-' : String(r.pushLastError).slice(0, 60)));
            }

            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
