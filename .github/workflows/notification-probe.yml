name: Notification Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete test log rows by computed ids
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
        run: |
          node <<'NODE'
          const EP = 'https://sgp.cloud.appwrite.io/v1';
          const DB = process.env.APPWRITE_DATABASE_ID;

          // Same compaction as scripts/appwrite-admin.cjs rowIdOf().
          const ROWID_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,35}$/;
          function compactHash(id) {
            let h1 = 0x811c9dc5, h2 = 0x01000193, h3 = 0x9e3779b9;
            for (let i = 0; i < id.length; i++) {
              const c = id.charCodeAt(i);
              h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
              h2 = Math.imul(h2 + c, 2654435761) >>> 0;
              h3 = Math.imul(h3 ^ (c + i), 2246822519) >>> 0;
            }
            return [h1, h2, h3].map((h) => h.toString(16).padStart(8, '0')).join('');
          }
          const rowIdOf = (logical) =>
            ROWID_RE.test(String(logical || '')) ? String(logical) : 'k' + compactHash(String(logical));

          async function aw(method, path, body) {
            const res = await fetch(EP + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
                'X-Appwrite-Key': process.env.APPWRITE_API_KEY
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (_) {}
            return { status: res.status, json, text };
          }

          const base = (t) => '/tablesdb/' + DB + '/tables/' + t;

          (async () => {
            const logicalIds = [
              'fixedtest0726_k88c2f5c06ccc9c48bee8e83e',
              'fixedtest0726_k24df32ed25138dd53915866d',
              'fixedtest1026_kba2a747bd48adaaf7ea242dd'
            ];
            for (const logical of logicalIds) {
              const rid = rowIdOf(logical);
              const d = await aw('DELETE', base('/notificationLog/rows/' + rid));
              console.log('delete ' + rid + ' (logical ' + logical + ') -> ' + d.status);
            }

            const l = await aw('GET', base('/notificationLog/rows?limit=5'));
            const n = await aw('GET', base('/notifications/rows?limit=5'));
            console.log('final: notificationLog total=' + (l.json && l.json.total) +
              ' notifications total=' + (n.json && n.json.total));
            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
