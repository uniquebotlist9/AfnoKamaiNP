name: Notification Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read push function config and execution logs
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          node <<'NODE'
          const EP = 'https://sgp.cloud.appwrite.io/v1';

          async function aw(method, path, body) {
            const res = await fetch(EP + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
                'X-Appwrite-Key': process.env.APPWRITE_API_KEY
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (_) {}
            return { status: res.status, json };
          }

          (async () => {
            // 1. Function metadata — what shape is config stored in?
            const fn = await aw('GET', '/functions/push-sender');
            console.log('FUNCTION GET status=' + fn.status);
            if (fn.json) {
              const keys = Object.keys(fn.json);
              console.log('FUNCTION fields:', keys.join(','));
              // Print any env/variable-ish field, redacting private keys.
              for (const k of ['env', 'variables', 'vars', 'secrets', 'environmentVariables']) {
                if (fn.json[k] !== undefined) {
                  const v = JSON.stringify(fn.json[k]).replace(
                    /("?(?:VAPID_PRIVATE_KEY|private)"?\s*[:=]\s*")([^"]*)(")/gi,
                    '$1<redacted>$3'
                  );
                  console.log('FUNCTION ' + k + ':', v.slice(0, 1500));
                }
              }
              if (fn.json.runtime) console.log('runtime:', fn.json.runtime, 'entry:', fn.json.entrypoint || '-', 'spec:', fn.json.entrypoint || '');
            }

            // 2. Latest event-triggered execution — full stdout/errors.
            const ex = await aw('GET', '/functions/push-sender/executions?limit=40&query=' +
              encodeURIComponent(JSON.stringify({ method: 'orderDesc', attribute: 'createdAt', values: [] })));
            const all = (ex.json && ex.json.executions) || [];
            const events = all.filter((e) => e.trigger === 'event');
            console.log('executions total=' + all.length + ' events=' + events.length);
            for (const e of events.slice(0, 2)) {
              console.log('EVENT ' + e.$id + ' ' + e.$createdAt + ' status=' + e.status);
              const detail = await aw('GET', '/functions/push-sender/executions/' + e.$id);
              const d = detail.json || {};
              console.log('DETAIL status=' + detail.status + ' fields=' + Object.keys(d).join(','));
              const out = String(d.stdout || d.logs || '');
              const err = String(d.errors || d.stderr || '');
              console.log('STDOUT (' + out.length + ' chars):');
              console.log(out.slice(0, 4000));
              if (err) {
                console.log('ERRORS (' + err.length + ' chars):');
                console.log(err.slice(0, 2000));
              }
            }

            console.log('expected public (site+github):', process.env.VAPID_PUBLIC_KEY);
            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
