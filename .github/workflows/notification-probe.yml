name: Notification Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove test delivery-log rows
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
        run: |
          node <<'NODE'
          const EP = 'https://sgp.cloud.appwrite.io/v1';
          const DB = process.env.APPWRITE_DATABASE_ID;

          async function aw(method, path, body) {
            const res = await fetch(EP + path, {
              method,
              headers: {
                'Content-Type': 'application/json',
                'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
                'X-Appwrite-Key': process.env.APPWRITE_API_KEY
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let json = null;
            try { json = text ? JSON.parse(text) : null; } catch (_) {}
            return { status: res.status, json, text };
          }

          const base = (t) => '/tablesdb/' + DB + '/tables/' + t;
          const TEST_IDS = ['fixedtest0726', 'fixedtest1026'];

          (async () => {
            // Newest-first first page — my test rows are the most recent.
            let rows = [];
            const q = encodeURIComponent('orderDesc("$createdAt")');
            let r = await aw('GET', base('/notificationLog/rows?limit=25&queries=' + q));
            rows = (r.json && r.json.rows) || [];
            console.log('page1 (orderDesc): ' + rows.length + ' rows, newest=' +
              (rows[0] && rows[0].$createdAt) + ', oldest=' +
              (rows[rows.length - 1] && rows[rows.length - 1].$createdAt));

            if (!rows.length || !String(rows[0].$createdAt || '').startsWith('2026-10-09T07')) {
              console.log('orderDesc not applied — paginating with cursorAfter');
              rows = [];
              let cursor = null;
              for (let i = 0; i < 4; i++) {
                const url = base('/notificationLog/rows?limit=25' +
                  (cursor ? '&queries=' + encodeURIComponent('cursorAfter("' + cursor + '")') : ''));
                const p = await aw('GET', url);
                const batch = (p.json && p.json.rows) || [];
                if (!batch.length) break;
                rows = rows.concat(batch);
                cursor = batch[batch.length - 1].$id;
                console.log('page ' + (i + 1) + ': ' + batch.length + ' rows, last=' + cursor);
                if (rows.some((x) => TEST_IDS.some((t) => String(x.notificationId || '').startsWith(t)))) break;
              }
            }

            let deleted = 0;
            for (const row of rows) {
              if (TEST_IDS.some((t) => String(row.notificationId || '').startsWith(t))) {
                const d = await aw('DELETE', base('/notificationLog/rows/' + row.$id));
                console.log('delete log ' + row.$id + ' notif=' + row.notificationId +
                  ' status=' + row.status + ' -> ' + d.status);
                if (d.status === 204) deleted++;
              }
            }
            console.log('deleted=' + deleted);

            const l2 = await aw('GET', base('/notificationLog/rows?limit=5'));
            const n2 = await aw('GET', base('/notifications/rows?limit=5'));
            console.log('final: notificationLog total=' + (l2.json && l2.json.total) +
              ' notifications total=' + (n2.json && n2.json.total));
            console.log('DONE');
          })().catch((e) => {
            console.error('FAILED:', e.message);
            process.exit(1);
          });
          NODE
